<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUBIRA ODACL | Verificando sesión</title>
<link rel="icon" href="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sidebar-bg: #0f172a;
    --primary: #1e293b;
    --primary-gold: #d97706;
    --primary-2: #b45309;
    --bg: #f8fafc;
    --card-bg: #ffffff;
    --border: #e2e8f0;
    --text: #0f172a;
    --text-muted: #64748b;
    --danger: #dc2626;
    --shadow-md: 0 10px 25px -5px rgba(0,0,0,.08), 0 4px 6px -4px rgba(0,0,0,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); }
  body { display: grid; place-items: center; min-height: 100dvh; padding: 20px; }
  .card {
    width: min(440px, 100%); background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
    box-shadow: var(--shadow-md); padding: 42px 34px; text-align: center; position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
    background: linear-gradient(90deg, #1e293b, #d97706, #0f172a);
  }
  .logo-wrap {
    display: inline-flex; align-items: center; justify-content: center;
    width: 60px; height: 60px; border-radius: 14px; background: var(--sidebar-bg);
    margin-bottom: 20px; box-shadow: 0 8px 16px rgba(15,23,42,.15);
  }
  .logo { width: 38px; height: 38px; object-fit: contain; }
  .badge {
    display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .08em; color: #92400e; background: #fef3c7;
    border: 1px solid #fde68a; padding: 4px 10px; border-radius: 999px; margin-bottom: 12px;
  }
  h1 { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 6px; letter-spacing: -.02em; }
  p { font-size: 13px; color: var(--text-muted); line-height: 1.6; }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--border);
    border-top-color: var(--primary-gold); animation: spin .8s linear infinite; margin: 22px auto 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    margin-top: 18px; padding: 14px; border-radius: 10px; background: #fee2e2;
    border: 1px solid #fca5a5; color: #991b1b; font-size: 12.5px; text-align: left; line-height: 1.5;
  }
  a.btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 18px; padding: 11px 22px; border-radius: 10px;
    background: linear-gradient(135deg, #1e293b, #0f172a); color: #fff;
    font-size: 13px; font-weight: 700; text-decoration: none; border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 4px 12px rgba(15,23,42,.15); transition: opacity .15s;
  }
  a.btn:hover { opacity: .92; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo-wrap">
      <img class="logo" src="https://raw.githubusercontent.com/qubira/IMAGENES/main/logo2.png" alt="QUBIRA">
    </div>
    <div>
      <span class="badge">⚖️ ODACL &bull; Asuntos Corporativos</span>
    </div>
    <h1 id="title">Verificando tu sesión en ODACL…</h1>
    <p id="subtitle">Oficina de Dirección de Asuntos Corporativos y Legales</p>
    <div class="spinner" id="spinner"></div>
    <div id="error-container"></div>
  </div>

<script>
'use strict';

/* Procesamiento de código de traspaso desde el hub central de QUBIRA */
const QODACL_API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:4000'
  : 'https://api-qubira.onrender.com';

const CENTRAL_LOGIN_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
  ? 'http://localhost:5515/modulo.html'
  : 'https://qubira-login.vercel.app/modulo.html';

function goToPanel(next) {
  window.location.href = 'index.html' + (next ? ('?open=' + encodeURIComponent(next)) : '');
}
function goToCentralHub() {
  window.location.href = CENTRAL_LOGIN_URL;
}
function showError(msg) {
  document.getElementById('title').textContent = 'Acceso no disponible';
  document.getElementById('subtitle').textContent = 'No fue posible validar tus credenciales en ODACL';
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('error-container').innerHTML = `
    <div class="error-box">${msg}</div>
    <a class="btn" href="${CENTRAL_LOGIN_URL}">Volver al Centro de Módulos</a>
  `;
}

function hasOdaclAccess(user) {
  if (!user) return false;
  if (user.nivel_acceso >= 100) return true;
  const mods = user.authorized_modules || [];
  return mods.includes('ODACL') || mods.includes('DJ') || mods.includes('ADG');
}

const next = new URLSearchParams(location.search).get('next');

async function exchangeHandoff(code) {
  try {
    const res = await fetch(`${QODACL_API_BASE}/api/auth/exchange`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      showError(data.error || 'El código de traspaso venció o ya fue utilizado.');
      return;
    }

    if (!hasOdaclAccess(data.user)) {
      showError('Tu usuario no cuenta con autorización para la Oficina de Asuntos Corporativos y Legales (ODACL).');
      return;
    }

    localStorage.setItem('qodacl_token', data.token);
    localStorage.setItem('qodacl_user', JSON.stringify(data.user));
    history.replaceState(null, '', location.pathname);
    goToPanel(next);
  } catch (err) {
    showError('No se pudo conectar con el servidor central de autenticación de QUBIRA.');
  }
}

async function checkExistingSession() {
  const existingToken = localStorage.getItem('qodacl_token') || localStorage.getItem('qubira_token');
  if (!existingToken) {
    goToCentralHub();
    return;
  }

  try {
    const res = await fetch(`${QODACL_API_BASE}/api/auth/me`, {
      headers: { Authorization: 'Bearer ' + existingToken }
    });
    if (!res.ok) {
      localStorage.removeItem('qodacl_token');
      localStorage.removeItem('qodacl_user');
      goToCentralHub();
      return;
    }
    const data = await res.json();
    if (!hasOdaclAccess(data.user)) {
      localStorage.removeItem('qodacl_token');
      localStorage.removeItem('qodacl_user');
      showError('Tu cuenta no tiene autorización para acceder a ODACL.');
      return;
    }
    localStorage.setItem('qodacl_token', existingToken);
    localStorage.setItem('qodacl_user', JSON.stringify(data.user));
    goToPanel(next);
  } catch (err) {
    // Si falla la red pero hay token y usuario guardado localmente, permitir continuar en offline/dev
    const cachedUser = localStorage.getItem('qodacl_user');
    if (cachedUser) {
      try {
        const u = JSON.parse(cachedUser);
        if (hasOdaclAccess(u)) {
          goToPanel(next);
          return;
        }
      } catch (_) {}
    }
    showError('No se pudo verificar la sesión con el servidor.');
  }
}

(function init() {
  const code = new URLSearchParams(location.search).get('handoff');
  if (code) {
    exchangeHandoff(code);
    return;
  }
  checkExistingSession();
})();
</script>
</body>
</html>
